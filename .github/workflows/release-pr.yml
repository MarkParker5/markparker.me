name: Release PR

# markparker.me releases by pushing to master (node.js.yml then deploys to GitHub Pages).
# So the one-click release is merging an auto-maintained develop -> master PR. This keeps
# that PR open and its changelog fresh whenever develop moves (incl. after Dependabot
# auto-merges), and @mentions the owner.
on:
  push:
    branches: [develop]
  # Also on a schedule: a Dependabot auto-merge pushes to develop with GITHUB_TOKEN,
  # and GitHub does NOT trigger `push` workflows for GITHUB_TOKEN commits (loop
  # prevention) — so without this, the release PR wouldn't refresh after an auto-merge.
  # The schedule runs from the default branch's copy of this file.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    uses: ParkerIndustries/workflows/.github/workflows/release-pr.yml@v1
    with:
      stable-branch: master
      dev-branch: develop
      mention: "@MarkParker5"
