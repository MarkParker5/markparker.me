name: Deploy to Github Pages

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write   # let GITHUB_TOKEN push the built site to the gh-pages branch

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Build
        run: |
          npm i
          npm run build
          rm out/*.gen.html

      - name: Deploy
        # Publish via the auto-provided GITHUB_TOKEN instead of the SSH deploy key
        # (ACTIONS_DEPLOY_KEY was rejected with "Permission denied (publickey)").
        # Pushes to the gh-pages branch, which Pages serves from.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out